<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Grievance Redressal Redirect | Municipal Service Portal</title>
  <meta name="description" content="Redirecting to your citizen grievances dashboard or submission page on the Municipal Service Portal.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <main id="main-content" class="container py-8 text-center">
    <h1 class="text-2xl font-bold mb-4">Redirecting to Grievances...</h1>
    <p class="text-muted">Please wait while we redirect you to grievance redressal.</p>
  </main>
  <script type="module">
    import { getAuthUser } from './js/api.js';
    const user = await getAuthUser();
    if (user && user.role === 'admin') {
      window.location.replace('admin-complaints.html');
    } else if (user) {
      window.location.replace('user-dashboard.html#complaints');
    } else {
      window.location.replace('submit-complaint.html');
    }
  </script>
</body>
</html>
